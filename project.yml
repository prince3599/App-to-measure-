# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: MeasurePlan
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  PlanCore:
    path: Packages/PlanCore
targets:
  MeasurePlan:
    type: application
    platform: iOS
    sources: [MeasurePlan]
    dependencies:
      - package: PlanCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.measureplan
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MeasurePlan
        INFOPLIST_KEY_NSCameraUsageDescription: "MeasurePlan uses the camera and LiDAR scanner to measure your room."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
